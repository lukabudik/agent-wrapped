name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the CLI and the web app import @agent-wrapped/core through
      # its compiled dist/, so on a clean checkout nothing else can type-check
      # until core has been built. pnpm -r walks the workspace in dependency
      # order, so core is always first.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint

      - run: pnpm format:check
